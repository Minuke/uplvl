<header class="habits-list__header">
  <h1 class="habits-list__title">Mis hábitos</h1>
  <button type="button" class="btn btn--primary" (click)="openCreateForm()">+ Nuevo hábito</button>
</header>

@if (habitsStore.isLoading()) {
  <app-skeleton-list [count]="3" />
} @else if (habitsStore.habits().length === 0) {
  <p class="empty-message">Aún no tienes hábitos. Crea el primero para empezar a ganar XP.</p>
} @else {
  <ul class="quest-list">
    @for (habit of habitsStore.habits(); track habit.id) {
      <app-habit-card
        [habit]="habit"
        [showActions]="true"
        (toggle)="habitsStore.toggleHabit($event)"
        (edit)="openEditForm($event)"
        (remove)="requestDeletion($event)"
      />
    }
  </ul>
}

@if (isFormOpen()) {
  <div class="habits-list__modal-backdrop" (click)="closeForm()">
    <div class="habits-list__modal-panel" (click)="$event.stopPropagation()">
      <app-habit-form
        [habitToEdit]="habitBeingEdited()"
        (save)="onFormSave($event)"
        (cancel)="closeForm()"
      />
    </div>
  </div>
}

@if (habitPendingDeletion(); as habit) {
  <app-confirm-dialog
    [message]="'¿Seguro que quieres eliminar &quot;' + habit.name + '&quot;? Esta acción no se puede deshacer.'"
    (confirm)="confirmDeletion()"
    (cancel)="cancelDeletion()"
  />
}
