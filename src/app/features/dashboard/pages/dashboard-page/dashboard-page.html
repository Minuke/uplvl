@let xpState = habitsStore.xpState();

<section class="dashboard">
  <header class="dashboard__header">
    <div class="level-badge" [class.level-badge--level-up]="justLeveledUp()">
      <span class="level-badge__value">{{ xpState.level }}</span>
    </div>
    <div class="dashboard__identity">
      <p class="dashboard__title">Tu progreso</p>
      <span class="streak-chip">🔥 {{ habitsStore.streakGlobal() }} días de racha</span>
    </div>
  </header>

  <div class="xp-bar">
    <div class="xp-bar__labels">
      <span>{{ xpState.currentXp }} XP</span>
      <span>{{ xpState.xpForNextLevel }} XP</span>
    </div>
    <div class="xp-bar__track">
      <div class="xp-bar__fill" [class.xp-bar__fill--no-transition]="skipTransition()"
        [style.width.%]="displayedProgress()"></div>
    </div>
  </div>

  <div class="dashboard__today">
    <h2 class="dashboard__section-title">Hábitos de hoy</h2>
    <ul class="quest-list">
      @for (habit of habitsStore.habitsToday(); track habit.id) {
        <app-habit-card [habit]="habit" (toggle)="habitsStore.toggleHabit($event)" />
      }
    </ul>
  </div>
</section>
